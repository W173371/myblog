<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - 页面未找到 | 魏俊浩的博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fdfcf8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; }
    h1 { font-size: 6rem; color: #c0504d; margin-bottom: 0.5rem; }
    p { font-size: 1.2rem; margin-bottom: 2rem; color: #666; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #c0504d;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.2s;
    }
    a:hover { background: #a0403d; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1d23; color: #ddd; }
      p { color: #999; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>抱歉，你访问的页面不存在</p>
    <a href="/">← 返回首页</a>
  </div>
</body>
</html>
