<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面未找到 | 魏俊浩的博客</title>
  <!-- 注意：本页是 static 下的静态文件，不经 Hugo 渲染，路径必须硬编码。
       线上部署在域名根路径（CI 用 Pages 域名覆盖 baseURL），所以这里用 / 开头，
       不要写成 /myblog/ —— 那会导致 favicon 与「回到首页」全部 404。 -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:#0e1014; color:#e9e9ec;
      display:flex; justify-content:center; align-items:center;
      min-height:100vh; text-align:center; padding:2rem;
      -webkit-font-smoothing:antialiased;
    }
    .code{
      font-size:clamp(4rem,14vw,7rem); font-weight:700;
      color:#5b8cff; letter-spacing:.04em; line-height:1; margin-bottom:.5em;
    }
    .desc{ font-size:1.15rem; color:#9aa0a8; line-height:1.8; margin-bottom:2.4em; }
    .back{
      display:inline-block; padding:.8em 2.2em; border-radius:999px;
      border:1px solid #5b8cff; color:#e9e9ec; text-decoration:none;
      font-size:1rem; transition:background .2s ease,transform .2s ease;
    }
    .back:hover{ background:#5b8cff; transform:translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <p class="desc">你要找的页面，没能从后台进程里输出。</p>
    <a class="back" href="/">回到首页 <span aria-hidden="true">→</span></a>
  </div>
</body>
</html>
